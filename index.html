<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F59E0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tournée Haupa</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2334;
  --amber:#F59E0B;--amber-dim:#92600a;--amber-light:#FDE68A;
  --green:#10B981;--green-dim:#064e3b;
  --red:#EF4444;--red-dim:#450a0a;
  --blue:#3B82F6;--blue-dim:#1e3a5f;
  --text:#F1F5F9;--text2:#94A3B8;--text3:#475569;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --radius:14px;--radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',sans-serif}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;z-index:100;padding:calc(var(--safe-top) + 14px) 16px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#header-left{display:flex;align-items:center;gap:10px}
#header-logo{width:34px;height:34px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:18px}
#header-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
#header-date{font-size:12px;color:var(--text2);margin-top:1px}
.header-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;margin-left:6px}
.header-btn:active{background:var(--bg3)}
#btn-refresh.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATS BAR */
#stats-bar{position:fixed;top:calc(var(--safe-top) + 63px);left:0;right:0;z-index:99;padding:10px 16px;background:var(--bg);display:flex;gap:8px}
.stat-chip{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-chip .val{font-size:18px;font-weight:700}
.stat-chip .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
.stat-chip.amber .val{color:var(--amber)}
.stat-chip.green .val{color:var(--green)}

/* SCROLL */
#scroll{position:fixed;top:calc(var(--safe-top) + 63px + 70px);bottom:calc(var(--safe-bot) + 60px);left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 16px}

/* LOGIN SCREEN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;padding:24px}
#login-screen .logo-big{font-size:56px}
#login-screen h2{font-size:22px;font-weight:700;letter-spacing:-0.5px}
#login-screen p{font-size:14px;color:var(--text2);text-align:center}
.driver-list{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.driver-btn{width:100%;padding:14px 20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);font-size:16px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:background 0.15s}
.driver-btn:active{background:var(--bg3)}
.driver-avatar{width:36px;height:36px;border-radius:50%;background:var(--amber-dim);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--amber);flex-shrink:0}

/* PHOTO SCREEN */
#photo-screen{display:flex;flex-direction:column;gap:16px;padding:8px 0}
.photo-header{font-size:14px;color:var(--text2);margin-bottom:4px}
.photo-zone{width:100%;min-height:200px;background:var(--bg2);border:2px dashed var(--border2);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;padding:20px;transition:border-color 0.2s}
.photo-zone:active{border-color:var(--amber)}
.photo-zone img{width:100%;border-radius:var(--radius-sm);object-fit:contain;max-height:300px}
.photo-zone .ph-icon{font-size:40px}
.photo-zone .ph-txt{font-size:14px;color:var(--text2);text-align:center}
#input-photo{display:none}
.btn-primary{width:100%;padding:14px;background:var(--amber);color:#0f1117;border:none;border-radius:50px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.15s}
.btn-primary:active{opacity:0.85}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.btn-secondary{width:100%;padding:13px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:50px;font-size:15px;font-weight:600;cursor:pointer}
.btn-secondary:active{background:var(--bg2)}

/* STATE SCREEN */
#state-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px;text-align:center;padding:24px}
#state-icon{font-size:52px}
#state-msg{font-size:16px;color:var(--text2);line-height:1.5}
.loader{width:28px;height:28px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--amber);animation:spin 0.7s linear infinite;margin:0 auto}

/* STOP CARDS */
.stop-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:border-color 0.2s}
.stop-card.done{border-color:var(--green-dim);opacity:0.75}
.stop-card.current{border-color:var(--amber)}
.stop-header{display:flex;align-items:center;gap:12px;padding:13px 14px 10px}
.stop-num{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0}
.stop-card.current .stop-num{background:var(--amber);color:#0f1117;border-color:var(--amber)}
.stop-card.done .stop-num{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.stop-info{flex:1;min-width:0}
.stop-nom{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-card.done .stop-nom{text-decoration:line-through;color:var(--text2)}
.stop-addr{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-km{font-size:11px;color:var(--amber);font-weight:600;background:rgba(245,158,11,0.12);padding:3px 8px;border-radius:20px;flex-shrink:0}
.stop-card.done .stop-km{color:var(--text3);background:var(--bg3)}
.stop-tel{padding:0 14px 4px 56px;font-size:12px;color:var(--text2)}
.stop-actions{display:flex;border-top:1px solid var(--border)}
.btn-nav,.btn-done,.btn-undo,.btn-collect{flex:1;padding:11px 8px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;transition:background 0.15s}
.btn-nav{color:var(--amber);border-right:1px solid var(--border)}
.btn-nav:active{background:rgba(245,158,11,0.1)}
.btn-collect{color:var(--blue);border-right:1px solid var(--border)}
.btn-collect:active{background:rgba(59,130,246,0.1)}
.btn-done{color:var(--green)}
.btn-done:active{background:rgba(16,185,129,0.1)}
.btn-undo{color:var(--text2)}
.btn-undo:active{background:var(--bg3)}

/* COLLECTE MODAL */
#collecte-modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.7);overflow-y:auto;padding:16px}
#collecte-modal.open{display:block}
.modal-box{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border2);overflow:hidden;max-width:500px;margin:0 auto}
.modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:0 4px}
.modal-body{padding:14px}
.contenant-section{margin-bottom:16px}
.contenant-title{font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:8px}
.contenant-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.contenant-label{flex:1;font-size:13px;font-weight:500}
.contenant-nb{display:flex;align-items:center;gap:6px}
.nb-btn{width:28px;height:28px;border-radius:6px;background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nb-btn:active{background:var(--border2)}
.nb-val{font-size:15px;font-weight:700;min-width:20px;text-align:center}
.litres-row{margin-top:6px;background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.litres-label{font-size:13px;color:var(--text2);flex:1}
.litres-input{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:15px;padding:6px 10px;width:90px;text-align:right;outline:none}
.litres-input:focus{border-color:var(--amber)}
.litres-unit{font-size:12px;color:var(--text2)}
.modal-footer{padding:14px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn-modal-ok{flex:1;padding:13px;background:var(--green);color:#fff;border:none;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer}
.btn-modal-cancel{padding:13px 20px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:50px;font-size:15px;cursor:pointer}

/* DEPOT CARD */
.depot-card{background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.25);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.depot-icon{font-size:22px}
.depot-txt{flex:1}
.depot-label{font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:0.6px;font-weight:600}
.depot-name{font-size:14px;font-weight:600;margin-top:1px}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:calc(60px + var(--safe-bot));padding-bottom:var(--safe-bot);background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;padding:8px 0;transition:color 0.15s}
.nav-btn .nav-icon{font-size:20px}
.nav-btn.active{color:var(--amber)}

/* FAB */
#btn-gmaps{position:fixed;bottom:calc(var(--safe-bot) + 68px);right:14px;width:52px;height:52px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;font-size:22px;color:#0f1117;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(245,158,11,0.4);z-index:200}

/* SUMMARY */
#section-summary{display:none}
.summary-header{font-size:13px;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.summary-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.summary-name{font-size:14px;font-weight:500}
.summary-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.badge-done{background:var(--green-dim);color:var(--green)}
.badge-todo{background:var(--bg3);color:var(--text2)}
.summary-link{margin-top:8px;background:var(--amber);color:#0f1117;border:none;border-radius:50px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;margin-bottom:6px}

/* SETTINGS */
#section-settings{display:none}
.setting-group{margin-bottom:20px}
.setting-group-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:8px;padding-left:4px}
.setting-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:2px;display:flex;align-items:center;gap:10px}
.setting-label{font-size:14px;flex:1}
.setting-input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;width:140px;outline:none}
.setting-input:focus{border-color:var(--amber)}
.btn-save-settings{margin-top:10px;width:100%;padding:14px;background:var(--amber);color:#0f1117;border:none;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer}
.btn-logout{margin-top:8px;width:100%;padding:13px;background:transparent;color:var(--red);border:1px solid var(--red-dim);border-radius:50px;font-size:15px;font-weight:600;cursor:pointer}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:50px;font-size:14px;font-weight:600;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:var(--red)}

/* DRIVER BADGE */
#driver-badge{display:none;background:var(--amber-dim);border:1px solid var(--amber);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--amber)}
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <div id="header-logo">🛢</div>
    <div>
      <div id="header-title">Tournée Haupa</div>
      <div id="header-date"></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <div id="driver-badge"></div>
    <button class="header-btn" id="btn-photo" title="Photo tournée" onclick="showPhotoBtn()" style="display:none">📷</button>
    <button class="header-btn" id="btn-refresh" title="Recharger" onclick="loadTournee()" style="display:none">↻</button>
  </div>
</div>

<div id="stats-bar">
  <div class="stat-chip amber"><span class="val" id="stat-total">—</span><span class="lbl">Arrêts</span></div>
  <div class="stat-chip green"><span class="val" id="stat-done">0</span><span class="lbl">Faits</span></div>
  <div class="stat-chip"><span class="val" id="stat-km">—</span><span class="lbl">km ~</span></div>
</div>

<div id="scroll">
  <div id="section-tournee"></div>
  <div id="section-summary"></div>
  <div id="section-settings"></div>
</div>

<button id="btn-gmaps" title="Google Maps" onclick="openMaps()">🗺</button>

<div id="bottom-nav">
  <button class="nav-btn active" id="nav-tournee" onclick="showSection('tournee')"><span class="nav-icon">🗺</span><span>Tournée</span></button>
  <button class="nav-btn" id="nav-summary" onclick="showSection('summary')"><span class="nav-icon">✅</span><span>Résumé</span></button>
  <button class="nav-btn" id="nav-settings" onclick="showSection('settings')"><span class="nav-icon">⚙</span><span>Config</span></button>
</div>

<!-- COLLECTE MODAL -->
<div id="collecte-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-stop-name">Saisie collecte</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-modal-ok" onclick="validerCollecte()">✓ Valider & envoyer</button>
    </div>
  </div>
</div>

<input type="file" id="input-photo" accept="image/*" capture="environment">
<div class="toast" id="toast"></div>

<script>
// ── IDs AIRTABLE ──────────────────────────────────────────────────────────────
const BASE_ID = 'appLYwVCOYHSKWpVy';
const TBL_CLIENTS = 'tbl4OAfQ9q7A7UwBY';
const TBL_COLLECTES = 'tbl1SjkQCe5TBtkE9';
const TBL_SECTEUR = 'tbl08vhVdN8wdSAFC';

const F_COLLECTES = {
  date:        'fld0SG0Q8laJOnLTr',
  litresHuile: 'fldrwujuX2s3mIFQo',
  statut:      'fldBbxEWyjT6aCU8Y',
  client:      'fld29B95RKzugL4lG',
  collecteur:  'fldXxpV8wK0ePaLrT',
  huile30:     'fldbFu1PcNSuem25U',
  huile60:     'fldseSM6e4VsJuJDQ',
  huile120:    'fldwJ6zq6hrQy57fs',
  graisse30:   'fldiQJXZ4lwgQLrQ7',
  graisse60:   'fldtMVNG3qIKji6zx',
  graisse120:  'fldNui9tn1XLY4lD',
  cuve1000:    'fldSpphokFRIMFhFR',
  poubelle120: 'fld16oDVVHu5ZJbo5',
  graisseLtr:  'flduppS44PE0N8hGl',
  biodechets:  'fldUvyTSnXQsSd5tq',
  detail:      'fldHEs2Ab5rcUEpJv',
};

const CONTENANTS = [
  { key:'huile30',   label:'Bidon huile 30L',      section:'huile' },
  { key:'huile60',   label:'Bidon huile 60L',       section:'huile' },
  { key:'huile120',  label:'Bidon huile 120L',      section:'huile' },
  { key:'graisse30', label:'Bidon graisse 30L',     section:'graisse' },
  { key:'graisse60', label:'Bidon graisse 60L',     section:'graisse' },
  { key:'graisse120',label:'Bidon graisse 120L',    section:'graisse' },
  { key:'cuve1000',  label:'Cuve huile 1000L',      section:'cuve' },
  { key:'poubelle120',label:'Poubelle biodéchets 120L', section:'bio' },
];

// ── CONFIG ────────────────────────────────────────────────────────────────────
const CFG_KEY = 'haupa_config';
const DONE_KEY = 'haupa_done_';
const DATA_KEY = 'haupa_data_';
const DRIVER_KEY = 'haupa_driver';
const PHOTO_KEY = 'haupa_photo_';

const DEFAULT_CFG = {
  airtable:'', opencage:'', ors:'',
  lat:43.2573886, lng:-0.8768927,
  depotName:"Dépôt — 55 chemin de l'usine, Viodos"
};

function getCfg(){ try{ return {...DEFAULT_CFG,...JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}; } catch{ return {...DEFAULT_CFG}; } }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

// ── STATE ─────────────────────────────────────────────────────────────────────
let tourneeData = null;
let doneSet = new Set();
let currentSection = 'tournee';
let currentDriver = null;
let drivers = [];
let modalStopIdx = null;
let modalNbs = {};
let modalLitres = {};

function loadDoneState(){ try{ const r=localStorage.getItem(DONE_KEY+todayKey()); doneSet=new Set(r?JSON.parse(r):[]); } catch{ doneSet=new Set(); } }
function saveDoneState(){ localStorage.setItem(DONE_KEY+todayKey(), JSON.stringify([...doneSet])); }

// ── DATE ──────────────────────────────────────────────────────────────────────
function setHeaderDate(){
  const d=new Date();
  document.getElementById('header-date').textContent = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

// ── DRIVER ────────────────────────────────────────────────────────────────────
async function loadDrivers(){
  const cfg=getCfg();
  if(!cfg.airtable){ showLoginStatic(); return; }
  showLoginLoading();
  try{
    const qs=new URLSearchParams({'fields[]':'Collecteur habituel'});
    const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TBL_SECTEUR}?${qs}`,
      {headers:{Authorization:`Bearer ${cfg.airtable}`}});
    const body=await res.json();
    const all=new Set();
    (body.records||[]).forEach(r=>{
      const v=r.fields['Collecteur habituel'];
      if(Array.isArray(v)) v.forEach(n=>all.add(n));
    });
    drivers=[...all].sort();
    if(!drivers.length) drivers=['Philippe','Benat'];
  } catch{ drivers=['Philippe','Benat']; }
  showLoginScreen();
}

function showLoginLoading(){
  document.getElementById('section-tournee').innerHTML=`
    <div id="state-screen"><div class="loader"></div><div id="state-msg" style="margin-top:12px">Chargement…</div></div>`;
}

function showLoginStatic(){
  document.getElementById('section-tournee').innerHTML=`
    <div id="login-screen">
      <div class="logo-big">🛢</div>
      <h2>Tournée Haupa</h2>
      <p>Configure la clé API Airtable dans Paramètres pour continuer</p>
      <button class="btn-primary" onclick="showSection('settings')" style="margin-top:8px">Ouvrir paramètres</button>
    </div>`;
}

function showLoginScreen(){
  const saved=localStorage.getItem(DRIVER_KEY);
  if(saved && drivers.includes(saved)){ selectDriver(saved); return; }
  document.getElementById('section-tournee').innerHTML=`
    <div id="login-screen">
      <div class="logo-big">🛢</div>
      <h2>Qui collecte aujourd'hui ?</h2>
      <p>Sélectionne ton nom pour commencer</p>
      <div class="driver-list">
        ${drivers.map(d=>`
          <button class="driver-btn" onclick="selectDriver('${escHtml(d)}')">
            <div class="driver-avatar">${d.charAt(0).toUpperCase()}</div>
            ${escHtml(d)}
          </button>`).join('')}
      </div>
    </div>`;
}

function selectDriver(name){
  currentDriver=name;
  localStorage.setItem(DRIVER_KEY, name);

// ── AIRTABLE FETCH ────────────────────────────────────────────────────────────
async function fetchClients(apiKey){
  const records=[];
  let offset;
  do{
    const qs=new URLSearchParams({filterByFormula:'FIND("oui",ARRAYJOIN({Statut cuve}))>0'});
    ['Nom établissement','Adresse complete','Téléphone','GPS exact'].forEach(f=>qs.append('fields[]',f));
    if(offset) qs.set('offset',offset);
    const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TBL_CLIENTS}?${qs}`,
      {headers:{Authorization:`Bearer ${apiKey}`}});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(`Airtable ${res.status}: ${e?.error?.message||res.statusText}`); }
    const body=await safeJson(res,'Airtable fetchClients');
    records.push(...(body.records||[]));
    offset=body.offset;
  } while(offset);
  return records.map(r=>({
    id:r.id,
    nom:(r.fields['Nom établissement']||'').trim()||'(sans nom)',
    adresse:(r.fields['Adresse complete']||'').trim(),
    telephone:(r.fields['Téléphone']||'').trim(),
    gpsExact:(r.fields['GPS exact']||'').trim(),
  }));
}

// ── GPS / ORS ─────────────────────────────────────────────────────────────────
function parseGps(str){ if(!str) return null; const[a,b]=str.split(',').map(s=>parseFloat(s.trim())); return(isFinite(a)&&isFinite(b))?{lat:a,lng:b}:null; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// Helper : parse JSON en affichant le contexte en cas d'erreur
async function safeJson(res, label){
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){
    const m = e.message.match(/position (\d+)/);
    const pos = m ? parseInt(m[1]) : 0;
    const ctx = text.slice(Math.max(0,pos-60), pos+60).replace(/\n/g,'↵');
    throw new Error(`[${label}] ${e.message} — contexte: «${ctx}»`);
  }
}

async function geocode(addr,key){
  const qs=new URLSearchParams({q:addr,key,limit:'1',no_annotations:'1',language:'fr'});
  const res=await fetch(`https://api.opencagedata.com/geocode/v1/json?${qs}`);
  if(!res.ok) return null;
  const b=await safeJson(res,'OpenCage');
  return b.results?.length?b.results[0].geometry:null;
}

function haversine(a,b){
  const R=6371,t=x=>x*Math.PI/180,dLat=t(b.lat-a.lat),dLng=t(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(x));
}

async function optimiserORS(stops,depart,orsKey){
  const jobs=stops.map((s,i)=>({id:i+1,location:[s.lng,s.lat],description:s.nom}));
  const vehicle={id:1,profile:'driving-car',start:[depart.lng,depart.lat],end:[depart.lng,depart.lat]};
  const res=await fetch('https://api.openrouteservice.org/optimization',{
    method:'POST',
    headers:{Authorization:orsKey,'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({jobs,vehicles:[vehicle]})
  });
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(`ORS ${res.status}: ${JSON.stringify(e)}`); }
  const data=await safeJson(res,'ORS optimization');
  const route=data.routes?.[0]; if(!route) throw new Error('ORS: aucun itinéraire');
  const jobSteps=route.steps.filter(s=>s.type==='job');
  let pos=depart,kmTotal=0;
  const tournee=jobSteps.map(step=>{
    const s=stops[step.job-1],km=haversine(pos,s);
    kmTotal+=km; pos=s; return{...s,km};
  });
  return{tournee,kmTotal};
}

function genMapLinks(tournee,depart){
  const coord=p=>`${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
  const pts=[depart,...tournee,depart];
  const urls=[]; let i=0;
  while(i<pts.length){
    const chunk=pts.slice(i,i+10);
    urls.push('https://www.google.com/maps/dir/'+chunk.map(coord).join('/'));
    if(i+10>=pts.length) break; i+=9;
  }
  return urls;
}

// ── LOAD TOURNEE ──────────────────────────────────────────────────────────────
async function loadTournee(){
  if(!currentDriver){ showLoginScreen(); return; }
  const cfg=getCfg();
  if(!cfg.airtable){ showSection('settings'); return; }
  document.getElementById('btn-refresh').classList.add('spinning');
  setState('','Chargement Airtable…',false,true);
  try{
    const clients=await fetchClients(cfg.airtable);
    if(!clients.length){ setState('📭','Aucun client avec cuve "oui".',true); document.getElementById('btn-refresh').classList.remove('spinning'); return; }
    setState('','Géocodage GPS…',false,true);
    const enrichis=[]; let gc=0;
    for(const c of clients){
      const gps=parseGps(c.gpsExact);
      if(gps){ enrichis.push({...c,lat:gps.lat,lng:gps.lng}); continue; }
      if(!c.adresse) continue;
      if(gc++>0) await sleep(1100);
      const coords=await geocode(c.adresse,cfg.opencage);
      if(coords) enrichis.push({...c,lat:coords.lat,lng:coords.lng});
    }
    if(!enrichis.length){ setState('📍','Impossible de géolocaliser les clients.',true); document.getElementById('btn-refresh').classList.remove('spinning'); return; }
    setState('','Optimisation de la route…',false,true);
    const depart={lat:cfg.lat,lng:cfg.lng,nom:cfg.depotName};
    const{tournee,kmTotal}=await optimiserORS(enrichis,depart,cfg.ors);
    const mapLinks=genMapLinks(tournee,depart);
    tourneeData={tournee,depart,kmTotal,mapLinks,loadedAt:new Date().toISOString()};
    localStorage.setItem(DATA_KEY+todayKey(),JSON.stringify(tourneeData));
    loadDoneState();
    renderTournee(); updateStats(); renderSummary();
    document.getElementById('btn-gmaps').style.display='flex';
  } catch(e){ setState('❌',`Erreur : ${e.message}`,true); }
  document.getElementById('btn-refresh').classList.remove('spinning');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function setState(icon,msg,showBtn,loading=false){
  document.getElementById('section-tournee').innerHTML=`
    <div id="state-screen">
      <div id="state-icon">${loading?'<div class="loader"></div>':icon}</div>
      <div id="state-msg">${msg}</div>
      ${showBtn?`<button class="btn-primary" style="margin-top:8px" onclick="loadTournee()">Réessayer</button>`:''}
    </div>`;
}

function renderTournee(){
  if(!tourneeData) return;
  const{tournee,depart}=tourneeData;
  let html=`<div class="depot-card"><div class="depot-icon">🏭</div><div class="depot-txt"><div class="depot-label">Dépôt départ</div><div class="depot-name">${escHtml(depart.nom)}</div></div></div>`;
  tournee.forEach((s,i)=>{
    const done=doneSet.has(i);
    const isCurrent=!done&&!tournee.slice(0,i).some((_,j)=>!doneSet.has(j));
    const kmStr=s.km?`+${s.km.toFixed(1)} km`:'';
    html+=`
      <div class="stop-card ${done?'done':isCurrent?'current':''}">
        <div class="stop-header">
          <div class="stop-num">${done?'✓':i+1}</div>
          <div class="stop-info">
            <div class="stop-nom">${escHtml(s.nom)}</div>
            <div class="stop-addr">${escHtml(s.adresse||'')}</div>
          </div>
          ${kmStr?`<div class="stop-km">${kmStr}</div>`:''}
        </div>
        ${s.telephone?`<div class="stop-tel">📞 ${escHtml(s.telephone)}</div>`:''}
        <div class="stop-actions">
          <button class="btn-nav" onclick="navToStop(${i})">🗺 Naviguer</button>
          ${done
            ?`<button class="btn-undo" onclick="markUndo(${i})">↩ Annuler</button>`
            :`<button class="btn-collect" onclick="openModal(${i})">📋 Saisir</button>
              <button class="btn-done" onclick="markDoneQuick(${i})">✓</button>`
          }
        </div>
      </div>`;
  });
  html+=`<div class="depot-card" style="margin-top:4px;opacity:0.7"><div class="depot-icon">🏠</div><div class="depot-txt"><div class="depot-label">Retour</div><div class="depot-name">${escHtml(depart.nom)}</div></div></div>`;
  document.getElementById('section-tournee').innerHTML=html;
}

function updateStats(){
  if(!tourneeData) return;
  document.getElementById('stat-total').textContent=tourneeData.tournee.length;
  document.getElementById('stat-done').textContent=doneSet.size;
  document.getElementById('stat-km').textContent=Math.round(tourneeData.kmTotal);
}

function renderSummary(){
  if(!tourneeData){ document.getElementById('section-summary').innerHTML='<div style="color:var(--text2);text-align:center;padding:40px 0">Charge d\'abord une tournée</div>'; return; }
  const{tournee,mapLinks}=tourneeData;
  const pct=tournee.length?Math.round(doneSet.size/tournee.length*100):0;
  let html=`<div class="summary-header">Progression ${doneSet.size}/${tournee.length}</div>
    <div style="background:var(--bg2);border-radius:6px;height:6px;margin-bottom:14px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--green);border-radius:6px;transition:width 0.4s"></div>
    </div>`;
  tournee.forEach((s,i)=>{
    const ok=doneSet.has(i);
    html+=`<div class="summary-row"><span class="summary-name">${escHtml(s.nom)}</span><span class="summary-badge ${ok?'badge-done':'badge-todo'}">${ok?'✓ Fait':'À faire'}</span></div>`;
  });
  if(mapLinks?.length){
    if(mapLinks.length===1) html+=`<a class="summary-link" href="${mapLinks[0]}" target="_blank">🗺 Ouvrir dans Maps</a>`;
    else mapLinks.forEach((url,i)=>{ html+=`<a class="summary-link" href="${url}" target="_blank">🗺 Maps — Segment ${i+1}/${mapLinks.length}</a>`; });
  }
  document.getElementById('section-summary').innerHTML=html;
}

// ── MODAL COLLECTE ────────────────────────────────────────────────────────────
function openModal(idx){
  if(!tourneeData) return;
  modalStopIdx=idx;
  modalNbs={}; modalLitres={};
  CONTENANTS.forEach(c=>{ modalNbs[c.key]=0; });
  modalLitres.huile=0; modalLitres.graisse=0; modalLitres.bio=0;

  const s=tourneeData.tournee[idx];
  document.getElementById('modal-stop-name').textContent=s.nom;

  const sections={
    huile:   {label:'Huile', contenants:CONTENANTS.filter(c=>c.section==='huile')},
    graisse: {label:'Graisse', contenants:CONTENANTS.filter(c=>c.section==='graisse')},
    cuve:    {label:'Cuve huile', contenants:CONTENANTS.filter(c=>c.section==='cuve')},
    bio:     {label:'Biodéchets', contenants:CONTENANTS.filter(c=>c.section==='bio')},
  };

  let html='';
  for(const[skey,sec] of Object.entries(sections)){
    html+=`<div class="contenant-section"><div class="contenant-title">${sec.label}</div>`;
    sec.contenants.forEach(c=>{
      html+=`<div class="contenant-row">
        <div class="contenant-label">${c.label}</div>
        <div class="contenant-nb">
          <button class="nb-btn" onclick="changeNb('${c.key}',-1)">−</button>
          <div class="nb-val" id="nb-${c.key}">0</div>
          <button class="nb-btn" onclick="changeNb('${c.key}',+1)">+</button>
        </div>
      </div>`;
    });
    // Litrage réel par section
    if(skey==='huile'){
      html+=`<div class="litres-row"><div class="litres-label">Litres huile réels collectés</div><input class="litres-input" id="ltr-huile" type="number" min="0" step="1" value="0"><div class="litres-unit">L</div></div>`;
    } else if(skey==='graisse'){
      html+=`<div class="litres-row"><div class="litres-label">Litres graisse réels collectés</div><input class="litres-input" id="ltr-graisse" type="number" min="0" step="1" value="0"><div class="litres-unit">L</div></div>`;
    } else if(skey==='bio'){
      html+=`<div class="litres-row"><div class="litres-label">Litres biodéchets collectés</div><input class="litres-input" id="ltr-bio" type="number" min="0" step="1" value="0"><div class="litres-unit">L</div></div>`;
    }
    html+='</div>';
  }

  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('collecte-modal').classList.add('open');
}

function changeNb(key,delta){
  modalNbs[key]=Math.max(0,(modalNbs[key]||0)+delta);
  document.getElementById('nb-'+key).textContent=modalNbs[key];
}

function closeModal(){
  document.getElementById('collecte-modal').classList.remove('open');
  modalStopIdx=null;
}

async function validerCollecte(){
  if(modalStopIdx===null) return;
  const cfg=getCfg();
  if(!cfg.airtable){ showToast('Clé API manquante','error'); return; }
  const s=tourneeData.tournee[modalStopIdx];

  const litresHuile=parseFloat(document.getElementById('ltr-huile')?.value)||0;
  const litresGraisse=parseFloat(document.getElementById('ltr-graisse')?.value)||0;
  const litresBio=parseFloat(document.getElementById('ltr-bio')?.value)||0;

  const fields={};
  fields[F_COLLECTES.date]=todayISO();
  fields[F_COLLECTES.statut]='Collecté';
  fields[F_COLLECTES.client]=[s.id];
  fields[F_COLLECTES.litresHuile]=litresHuile;
  fields[F_COLLECTES.graisseLtr]=litresGraisse;
  fields[F_COLLECTES.biodechets]=litresBio;
  if(currentDriver) fields[F_COLLECTES.collecteur]=currentDriver;
  CONTENANTS.forEach(c=>{ if(modalNbs[c.key]>0) fields[F_COLLECTES[c.key]]=modalNbs[c.key]; });

  // Détail texte
  const lignes=CONTENANTS.filter(c=>modalNbs[c.key]>0).map(c=>`${c.label}: ${modalNbs[c.key]}`);
  if(litresHuile>0) lignes.push(`Litres huile: ${litresHuile}L`);
  if(litresGraisse>0) lignes.push(`Litres graisse: ${litresGraisse}L`);
  if(litresBio>0) lignes.push(`Litres biodéchets: ${litresBio}L`);
  if(lignes.length) fields[F_COLLECTES.detail]=lignes.join('\n');

  try{
    const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${TBL_COLLECTES}`,{
      method:'POST',
      headers:{Authorization:`Bearer ${cfg.airtable}`,'Content-Type':'application/json'},
      body:JSON.stringify({records:[{fields}]})
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||res.statusText); }
    doneSet.add(modalStopIdx); saveDoneState();
    closeModal(); renderTournee(); updateStats(); renderSummary();
    showToast('Collecte enregistrée dans Airtable ✓');
  } catch(e){ showToast(`Erreur: ${e.message}`,'error'); }
}

function markDoneQuick(idx){
  doneSet.add(idx); saveDoneState(); renderTournee(); updateStats(); renderSummary();
  showToast('Arrêt validé');
}

function markUndo(idx){
  doneSet.delete(idx); saveDoneState(); renderTournee(); updateStats(); renderSummary();
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function navToStop(idx){
  if(!tourneeData) return;
  const s=tourneeData.tournee[idx];
  const dest=s.lat&&s.lng?`${s.lat},${s.lng}`:encodeURIComponent(s.adresse);
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=driving`,'_blank');
}

function openMaps(){
  if(!tourneeData?.mapLinks?.length) return;
  window.open(tourneeData.mapLinks[0],'_blank');
}

// ── SECTIONS ──────────────────────────────────────────────────────────────────
function showSection(name){
  currentSection=name;
  ['tournee','summary','settings'].forEach(s=>{
    document.getElementById(`section-${s}`).style.display=s===name?'block':'none';
    document.getElementById(`nav-${s}`).classList.toggle('active',s===name);
  });
  document.getElementById('btn-gmaps').style.display=(name==='tournee'&&tourneeData)?'flex':'none';
  if(name==='settings') loadSettingsForm();
  if(name==='summary') renderSummary();
}

// ── SETTINGS ─────────────────────────────────────────────────────────────────
function loadSettingsForm(){
  const cfg=getCfg();
  document.getElementById('section-settings').innerHTML=`
    <div class="setting-group">
      <div class="setting-group-title">Clés API</div>
      <div class="setting-row"><span class="setting-label">Airtable</span><input class="setting-input" id="cfg-airtable" type="password" placeholder="pat…" value="${escHtml(cfg.airtable)}"></div>
      <div class="setting-row"><span class="setting-label">OpenCage</span><input class="setting-input" id="cfg-opencage" type="password" placeholder="clé…" value="${escHtml(cfg.opencage)}"></div>
      <div class="setting-row"><span class="setting-label">ORS</span><input class="setting-input" id="cfg-ors" type="password" placeholder="eyJ…" value="${escHtml(cfg.ors)}"></div>
    </div>
    <div class="setting-group">
      <div class="setting-group-title">Dépôt de départ</div>
      <div class="setting-row"><span class="setting-label">Latitude</span><input class="setting-input" id="cfg-lat" type="number" step="0.0001" value="${cfg.lat}"></div>
      <div class="setting-row"><span class="setting-label">Longitude</span><input class="setting-input" id="cfg-lng" type="number" step="0.0001" value="${cfg.lng}"></div>
      <div class="setting-row"><span class="setting-label">Nom dépôt</span><input class="setting-input" id="cfg-depot-name" type="text" value="${escHtml(cfg.depotName)}"></div>
    </div>
    <button class="btn-save-settings" onclick="saveSettings()">Enregistrer</button>
    <button class="btn-logout" onclick="logout()">Changer de chauffeur</button>`;
}

function saveSettings(){
  const cfg={
    airtable:document.getElementById('cfg-airtable').value.trim(),
    opencage:document.getElementById('cfg-opencage').value.trim(),
    ors:document.getElementById('cfg-ors').value.trim(),
    lat:parseFloat(document.getElementById('cfg-lat').value)||DEFAULT_CFG.lat,
    lng:parseFloat(document.getElementById('cfg-lng').value)||DEFAULT_CFG.lng,
    depotName:document.getElementById('cfg-depot-name').value.trim()||DEFAULT_CFG.depotName,
  };
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
  showToast('Configuration enregistrée ✓');
}

function logout(){
  currentDriver=null;
  localStorage.removeItem(DRIVER_KEY);
  document.getElementById('driver-badge').style.display='none';
  document.getElementById('btn-photo').style.display='none';
  document.getElementById('btn-refresh').style.display='none';
  tourneeData=null;
  showSection('tournee');
  loadDrivers();
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function escHtml(str){ return(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?` ${type}`:'');
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init(){
  setHeaderDate(); loadDoneState();
  showSection('tournee');
  // Cache du jour
  try{
    const cached=localStorage.getItem(DATA_KEY+todayKey());
    if(cached){
      tourneeData=JSON.parse(cached);
      const savedDriver=localStorage.getItem(DRIVER_KEY);
      if(savedDriver){
        currentDriver=savedDriver;
        document.getElementById('driver-badge').textContent=savedDriver;
        document.getElementById('driver-badge').style.display='block';
        document.getElementById('btn-photo').style.display='flex';
        document.getElementById('btn-refresh').style.display='flex';
        renderTournee(); updateStats();
        document.getElementById('btn-gmaps').style.display='flex';
        return;
      }
    }
  } catch{}
  loadDrivers();
}

init();
